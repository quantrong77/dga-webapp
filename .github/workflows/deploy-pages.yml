name: Deploy static app to GitHub Pages

on:
  push:
    branches:
      - main
      # TAM THOI: nhanh thu tren Pages (moi truong github-pages cho phep nhanh nay) — xoa nhanh sau khi thu xong
      - thu/gop-zalo-tai-trang-loai-thiet-bi
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # CHỈ đưa file web lên Pages (danh sách cho phép trong scripts/build-pages-site.js): index.html, manifest,
      # sw.js, config.js, src/ (domain, data, presentation), vendor/, assets/image/, mobile/ (trừ *.md) và
      # assets/template/template-*.docx. KHÔNG đưa: data/ (database.json: users/password_hash, sessions), backend/,
      # tests/, scripts/, docs/, pdf/, node_modules/, *.md nội bộ.
      # Script tự kiểm tra đủ file app cần (index.html, mobile/, sw.js precache, mẫu BBTN) — thiếu thì dừng.
      - name: Build site (allowlist)
        run: node scripts/build-pages-site.js _site

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4